<script>
/*! Unbroke quiz result page. Paste into each result page: Page settings > Custom code > Inside <head> tag.
 *  Change THIS_RESULT on each page: bucket_1 One Flat Tire, bucket_2 Cautiously Caffeinated,
 *  bucket_3 Solid Still Building, bucket_4 Quietly Unbothered.
 *  Drop-in blocks (an empty div with the attribute; the script fills it):
 *    data-quiz-ctas                 Download PDF, Share (opens X / Facebook / LinkedIn / Threads / Copy link), Follow, Retake
 *    data-quiz-zip-reveal           "Your zip, by the numbers" (hidden if there's no data)
 *  Custom attributes for your own Webflow elements, if you'd rather design the buttons yourself:
 *    data-quiz-name                 text is replaced with the person's first name
 *    data-quiz-pdf                  click downloads the full report as a PDF
 *    data-quiz-share="copy"         copies the quiz link
 *    data-quiz-share="x" | "linkedin" | "facebook" | "threads"   opens that site's share window
 *    data-quiz-share="native"       phone share sheet (hidden where the browser has none)
 *  Fonts follow the site; override with CSS variables on the div: --uq-display, --uq-serif, --uq-sans, --uq-mono, --uq-condensed
 */
(function () {
  'use strict';
  var THIS_RESULT = 'bucket_1';
  var QUIZ_PAGE = '/take-quiz';

  // ---- edit these if the links or copy change ----
  var FOLLOW_URL = 'https://www.instagram.com/unbroke_life/';
  var FOLLOW_HANDLE = '@unbroke_life';
  var LEVELS = ['Crisis', 'Fragile', 'Stable', 'Durable'];
  var BOOK_LINE = 'Unbroke: Why the Old Money Rules Are Broken, and How to Fund the Life You Actually Want, by Frank Rotman. Available early 2027.';
  var PDF_DISCLAIMER = 'Information provided within this website and any other materials are for educational purposes only and is not intended to replace individual investment advice. Nothing on this website should be interpreted to state or imply that past performance is an indication of future performance. All investments involve risk and unless otherwise stated, are not guaranteed. Unbroke is not engaged in the practice of law and does not provide legal advice. Always consult with an attorney regarding your specific legal situation. Further, Unbroke is not engaged in providing tax related services. Be sure to consult with a tax professional before implementing any investment strategy.';
  var PDF_FONTS = 'https://cdn.prod.website-files.com/6ab373a0665610b99aee7809/6aeaa50a2963bbc025309eaf_unbroke-pdf-fonts-v2.json';
  var CTA_FONT_CSS = 'https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap';

  var data = null;
  try {
    if (sessionStorage.getItem('uq_unlocked') === THIS_RESULT) data = JSON.parse(sessionStorage.getItem('uq_report') || 'null');
  } catch (e) {}

  // No unlock in this tab, or a different result: send them to take the quiz
  if (!data || data.bucket !== THIS_RESULT) {
    document.documentElement.style.visibility = 'hidden';
    location.replace(QUIZ_PAGE);
    return;
  }

  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function flash(el, text) {
    var lab = el.querySelector('.lbl') || el, plain = !lab.children.length, before = lab.textContent;
    el.classList.add('is-done');
    if (plain) lab.textContent = text;
    if (lab !== el && lab.animate && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      lab.style.display = 'inline-block';
      lab.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + MOTION.pop + ')' }, { transform: 'scale(1)' }],
        { duration: 420, easing: MOTION.ease });
    }
    setTimeout(function () { el.classList.remove('is-done'); if (plain) lab.textContent = before; }, 2000);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  var url = encodeURIComponent(data.shareUrl), text = encodeURIComponent(data.shareText);
  var LINKS = {
    x: 'https://twitter.com/intent/tweet?text=' + text + '&url=' + url,
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + url,
    linkedin: 'https://www.linkedin.com/sharing/share-offsite/?url=' + url,
    threads: 'https://www.threads.net/intent/post?text=' + text + '%20' + url
  };
  function nativeShare() {
    return navigator.share({ title: 'How broke are you?', text: data.shareText, url: data.shareUrl }).catch(function () {});
  }

  document.addEventListener('DOMContentLoaded', function () {
    each('[data-quiz-name]', function (el) { el.textContent = data.firstName; });
    each('[data-quiz-zip-reveal]', renderReveal);
    each('[data-quiz-ctas]', renderCtas);

    each('[data-quiz-share]', function (el) {
      var k = el.getAttribute('data-quiz-share');
      if (LINKS[k]) {
        el.setAttribute('href', LINKS[k]); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener');
        if (el.tagName !== 'A') el.addEventListener('click', function (e) { e.preventDefault(); window.open(LINKS[k], '_blank', 'noopener'); });
      } else if (k === 'native') {
        if (!navigator.share) { el.style.display = 'none'; return; }
        el.addEventListener('click', function (e) { e.preventDefault(); nativeShare(); });
      } else if (k === 'copy') {
        el.addEventListener('click', function (e) { e.preventDefault(); copy(data.shareUrl, el); });
      }
    });

    each('[data-quiz-pdf]', function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); downloadPdf(el); });
    });
  });

  function downloadPdf(el, busyText) {
    if (el.classList.contains('is-loading')) return;
    var lab = el.querySelector('.lbl') || el, before = lab.textContent;
    el.classList.add('is-loading'); el.setAttribute('aria-busy', 'true');
    if (busyText) lab.textContent = busyText;
    var done = function () {
      el.classList.remove('is-loading'); el.removeAttribute('aria-busy');
      if (busyText) lab.textContent = before;
    };
    Promise.all([getPdfLib(), getPdfFonts()])
      .then(function (r) { buildPdf(r[1]); done(); })
      .catch(function (err) { if (window.console) console.error('[unbroke] PDF', err); done(); flash(el, 'Try again'); });
  }

  /* ---------- CTA group: Download / Share / Follow / Retake ----------
     Motion matches the quiz: same easing, hover lift with a hard shadow, press-in, icon nudges,
     a left-to-right fill wipe for "done" states, and the staggered blur-in for anything that appears. */
  var MOTION = {
    ease: 'cubic-bezier(.16,1,.3,1)',   // same curve as the quiz
    inDuration: 560, stagger: 55, distance: 14, blur: 6,   // entrance (also the share buttons)
    hoverDuration: 250, lift: 2, shadow: 4, press: 0.985, // hover lift, hard shadow, press-in
    wipe: 340, nudge: 3,                                 // fill wipe, icon nudge (px)
    foldDuration: 460, menuDelay: 90,                    // share panel
    sweep: 1100, pop: 1.12                               // PDF loading sweep, "Copied!" pop
  };
  var ICON = {
    down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    out: '<path d="M7 17L17 7M8 7h9v9"/>',
    back: '<path d="M15 6l-6 6 6 6"/>'
  };
  function icon(k) {
    return '<svg class="ic ic-' + k + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg>';
  }
  var CTA_CSS =
    ':host{all:initial;display:block;container-type:inline-size;' +
      '--ink:#000;--mint:#95ffb1;--mint-on:#6ef08f;--soft:#effff4;--forest:#073823;--forest-on:#0d5233;' +
      '--cond:var(--uq-condensed,Oswald,"Arial Narrow",sans-serif);font-family:var(--uq-sans,"Inter Tight",Arial,sans-serif);color:var(--ink)}' +
    '*{box-sizing:border-box}' +
    '.btn,.menu a,.menu button{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;margin:0;' +
      'font-family:var(--cond);font-weight:600;line-height:1.15;text-transform:uppercase;text-align:center;text-decoration:none;cursor:pointer;' +
      '-webkit-tap-highlight-color:transparent;transition:transform var(--hd) var(--ease),box-shadow var(--hd) var(--ease),color .2s ease}' +
    '.btn{width:100%;min-height:56px;padding:10px 24px;border:1.5px solid var(--forest);border-radius:8px;font-size:clamp(18px,3.6cqi,22px);letter-spacing:.005em}' +
    // fill wipe, left to right, like a chosen quiz answer
    '.btn::before,.menu a::before,.menu button::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--on);' +
      'transform:scaleX(0);transform-origin:left center;transition:transform var(--wipe) var(--ease)}' +
    '.ic{width:.9em;height:.9em;flex:none;transition:transform calc(var(--hd) + 50ms) var(--ease)}' +
    '.mint{--on:var(--mint-on);background:var(--mint);color:var(--ink);border:2px solid var(--ink)}' +
    '.primary{--on:var(--forest-on);background:var(--forest);color:#fff}' +
    '.outline{--on:var(--soft);background:#fff;color:var(--forest)}' +
    '.btn:focus-visible,.menu a:focus-visible,.menu button:focus-visible,.retake:focus-visible{outline:3px solid var(--forest);outline-offset:3px}' +
    '@media (hover:hover){' +
      '.btn:hover,.menu a:hover,.menu button:hover{transform:translateY(calc(var(--lift) * -1));box-shadow:0 var(--shadow) 0 0 var(--ink)}' +
      '.btn:hover::before,.menu a:hover::before,.menu button:hover::before{transform:scaleX(1)}' +
      '.btn:hover .ic-down{transform:translateY(var(--nudge))}' +
      '.btn:hover .ic-out{transform:translate(calc(var(--nudge) * .7),calc(var(--nudge) * -.7))}' +
      '.retake:hover{color:var(--ink);text-underline-offset:5px}' +
      '.retake:hover .ic{transform:translateX(calc(var(--nudge) * -1))}' +
    '}' +
    '.btn:active,.menu a:active,.menu button:active{transform:translateY(0) scale(var(--press));box-shadow:0 0 0 0 var(--ink)}' +
    // share open: the button stays "chosen" and the plus turns into a close
    '.primary[aria-expanded="true"]::before{transform:scaleX(1)}' +
    '.primary[aria-expanded="true"] .ic-plus{transform:rotate(135deg)}' +
    // building the PDF: a progress sweep along the bottom, like the quiz progress bar
    '.btn.is-loading{cursor:progress}' +
    '.btn.is-loading::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--forest);transform-origin:left;' +
      'animation:sweep var(--sweep) var(--ease) infinite}' +
    '@keyframes sweep{0%{transform:scaleX(0);transform-origin:left}49%{transform:scaleX(1);transform-origin:left}' +
      '50%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}' +
    '.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}' +
    '.row .btn{font-size:18px}' +
    '.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--fold) var(--ease)}' +
    '.fold>div{overflow:hidden;min-height:0;padding:0 4px 6px;margin:0 -4px}' +
    '.fold.open{grid-template-rows:1fr}' +
    '.menu{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding:14px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;' +
      'opacity:0;transition:opacity .2s ease}' +
    '.open .menu{opacity:1}' +
    '.menu a,.menu button{--on:var(--mint);flex:1 1 120px;padding:10px 12px;border:1.5px solid var(--forest);border-radius:8px;background:var(--soft);color:var(--forest);font-size:16px}' +
    '.is-done::before{transform:scaleX(1)}' +
    '.retake{display:flex;align-items:center;gap:6px;margin:28px auto 0;padding:0;background:none;border:0;font-family:var(--uq-mono,Inconsolata,"DM Mono",ui-monospace,Menlo,monospace);font-size:13px;' +
      'color:var(--forest);text-decoration:underline;text-underline-offset:3px;cursor:pointer;width:max-content;' +
      'transition:color .2s ease,text-underline-offset var(--hd) var(--ease)}' +
    '.retake .ic{width:1em;height:1em}' +
    '.pre{opacity:0}' +
    '@container (max-width:520px){.row{grid-template-columns:1fr;gap:12px}}' +
    '@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}';

  var reducedMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  function canAnimate() { return !reducedMotion.matches && typeof Element.prototype.animate === 'function'; }
  // the quiz's entrance: rise, unblur, fade, staggered
  function blurIn(els, delay) {
    if (!canAnimate()) return;
    els.forEach(function (el, i) {
      el.classList.remove('pre');
      el.animate([
        { opacity: 0, transform: 'translate3d(0,' + MOTION.distance + 'px,0)', filter: 'blur(' + MOTION.blur + 'px)' },
        { opacity: 1, transform: 'none', filter: 'blur(0px)' }
      ], { duration: MOTION.inDuration, delay: (delay || 0) + i * MOTION.stagger, easing: MOTION.ease, fill: 'backwards' });
    });
  }

  function loadCtaFont() {
    if (!CTA_FONT_CSS || document.querySelector('link[data-uq-font]')) return;
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = CTA_FONT_CSS; l.setAttribute('data-uq-font', '');
    document.head.appendChild(l);
  }

  function motionVars() {
    var m = MOTION;
    return ':host{--ease:' + m.ease + ';--hd:' + m.hoverDuration + 'ms;--lift:' + m.lift + 'px;--shadow:' + m.shadow + 'px;--press:' + m.press +
      ';--wipe:' + m.wipe + 'ms;--nudge:' + m.nudge + 'px;--fold:' + m.foldDuration + 'ms;--sweep:' + m.sweep + 'ms}';
  }

  function renderCtas(el) {
    loadCtaFont();
    var root = el.shadowRoot || el.attachShadow({ mode: 'open' });
    var nets = [['x', 'X'], ['facebook', 'Facebook'], ['linkedin', 'LinkedIn'], ['threads', 'Threads']];
    var pre = canAnimate() && 'IntersectionObserver' in window ? ' pre' : '';
    root.innerHTML = '<style>' + CTA_CSS + motionVars() + '</style>' +
      '<div class="ctas">' +
        '<button type="button" class="btn mint' + pre + '" data-a="pdf"><span class="lbl">Download my results (PDF)</span>' + icon('down') + '</button>' +
        '<div class="row">' +
          '<button type="button" class="btn primary' + pre + '" data-a="share" aria-expanded="false" aria-controls="uq-share"><span class="lbl">Share my results</span>' + icon('plus') + '</button>' +
          '<a class="btn outline' + pre + '" href="' + esc(FOLLOW_URL) + '" target="_blank" rel="noopener"><span class="lbl">Follow Unbroke</span>' + icon('out') + '</a>' +
        '</div>' +
        '<div class="fold" id="uq-share"><div><div class="menu" role="group" aria-label="Share my results">' +
          nets.map(function (n) {
            return '<a href="' + esc(LINKS[n[0]]) + '" target="_blank" rel="noopener" tabindex="-1"><span class="lbl">' + n[1] + '</span></a>';
          }).join('') +
          '<button type="button" data-a="copy" tabindex="-1"><span class="lbl">Copy link</span></button>' +
        '</div></div></div>' +
        '<a class="retake' + pre + '" href="' + esc(QUIZ_PAGE) + '">' + icon('back') + '<span>Retake the quiz</span></a>' +
      '</div>';

    var all = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };
    if (pre) {
      var io = new IntersectionObserver(function (es) {
        if (!es.some(function (e) { return e.isIntersecting; })) return;
        io.disconnect();
        blurIn(all('.pre'));
      }, { threshold: 0.25 });
      io.observe(el);
    }

    var fold = root.querySelector('.fold'), shareBtn = root.querySelector('[data-a="share"]');
    function setOpen(open) {
      fold.classList.toggle('open', open);
      shareBtn.setAttribute('aria-expanded', String(open));
      var items = all('.menu a, .menu button');
      items.forEach(function (b) { b.tabIndex = open ? 0 : -1; });
      if (open) blurIn(items, MOTION.menuDelay);
    }
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-a]');
      if (!t) return;
      var a = t.getAttribute('data-a');
      if (a === 'pdf') downloadPdf(t, 'Building your report…');
      else if (a === 'copy') copy(data.shareText + ' ' + data.shareUrl, t);
      else if (a === 'share') {
        // phones get the OS share sheet (Instagram, iMessage, WhatsApp…); desktop gets the list
        if (navigator.share && window.matchMedia && matchMedia('(pointer: coarse)').matches) nativeShare();
        else setOpen(!fold.classList.contains('open'));
      }
    });
  }

  // ?tune: lets the tuning page re-render the block with new MOTION values
  if (window.UQCTA_TUNE || /[?&]tune\b/.test(location.search)) window.UQCTA = { motion: MOTION, render: renderCtas };

  /* ---------- "Your zip, by the numbers" ---------- */
  var REVEAL_CSS =
    ':host{all:initial;display:block;container-type:inline-size;' +
      '--ink:#000;--mint:#95ffb1;--soft:#effff4;--forest:#073823;' +
      'font-family:var(--uq-sans,"Inter Tight",Arial,sans-serif);color:var(--ink)}' +
    '.zs{position:relative;padding:56px clamp(18px,3.4cqi,40px) clamp(20px,2.8cqi,32px);border:2.5px solid var(--ink);border-radius:16px;background:var(--soft)}' +
    '.chip{position:absolute;top:12px;left:12px;padding:6px 10px;border-radius:4px;background:var(--ink);color:#fff;' +
      'font:700 11px/1.2 var(--uq-sans,"Inter Tight",Arial,sans-serif);letter-spacing:-.02em;text-transform:uppercase}' +
    'h3{margin:0 0 18px;font-family:var(--uq-serif,"Lastik - reg",Georgia,serif);font-weight:400;font-size:clamp(32px,4.6cqi,56px);line-height:1.02;letter-spacing:-.035em}' +
    '.sub{display:block;margin-top:6px;font-family:var(--uq-mono,Inconsolata,ui-monospace,Menlo,monospace);font-size:14px;letter-spacing:.02em;color:var(--forest)}' +
    '.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 22px}' +
    '.tiles.n2{grid-template-columns:repeat(2,minmax(0,1fr))}' +
    '.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:16px 18px;border:2px solid var(--ink);border-radius:10px;background:var(--mint)}' +
    '.v{font-family:var(--uq-display,"Abcgravityxxcompressed Ultra",Impact,"Arial Narrow",sans-serif);font-size:clamp(40px,8.4cqi,92px);line-height:.92;letter-spacing:.005em;white-space:nowrap}' +
    '.n2 .v{font-size:clamp(56px,11cqi,112px)}' +
    '.l{font-family:var(--uq-mono,Inconsolata,ui-monospace,Menlo,monospace);font-size:14px;line-height:1.35;color:var(--forest)}' +
    'p{margin:0 0 12px;font-size:clamp(16px,1.9cqi,21px);line-height:1.4;letter-spacing:-.02em}' +
    'p.s{font-weight:700}' +
    'p.src{margin:16px 0 0;font-family:var(--uq-mono,Inconsolata,ui-monospace,Menlo,monospace);font-size:12px;line-height:1.5;letter-spacing:.01em;color:#555}' +
    '@container (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.v{font-size:clamp(44px,19cqi,84px)}}' +
    '@container (max-width:340px){.zs{padding-top:52px}.tile{padding:12px 14px}}';

  function renderReveal(el) {
    var s = data.zipStats;
    if (!s || !s.tiles || !s.tiles.length) { el.style.display = 'none'; return; }
    var root = el.shadowRoot || el.attachShadow({ mode: 'open' });
    root.innerHTML = '<style>' + REVEAL_CSS + '</style>' +
      '<section class="zs" aria-label="Your zip, by the numbers"><span class="chip">Your zip, by the numbers</span>' +
      '<h3>' + esc(s.title) + (s.subtitle ? '<span class="sub">' + esc(s.subtitle) + '</span>' : '') + '</h3>' +
      '<div class="tiles n' + s.tiles.length + '">' + s.tiles.map(function (t) {
        return '<div class="tile"><span class="v">' + esc(t.value) + '</span><span class="l">' + esc(t.label) + '</span></div>';
      }).join('') + '</div>' +
      s.lines.map(function (l) { return '<p' + (l.strong ? ' class="s"' : '') + '>' + esc(l.text) + '</p>'; }).join('') +
      '<p class="src">' + esc(s.source) + ' Estimates, rounded.</p></section>';
  }

  function copy(text, el) {
    function ok() { flash(el, 'Copied!'); }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      t.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  /* ---------- PDF ---------- */
  var JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  var pdfLib = null, pdfFonts = null;
  function getPdfLib() {
    if (pdfLib) return pdfLib;
    pdfLib = window.jspdf ? Promise.resolve() : new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = JSPDF_URL; s.async = true; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    pdfLib.catch(function () { pdfLib = null; });
    return pdfLib;
  }
  // One JSON file in Webflow assets holds the report fonts (all SIL Open Font License), base64 TTF.
  // If it can't load, the report still builds in Helvetica.
  function getPdfFonts() {
    if (!pdfFonts) {
      pdfFonts = fetch(PDF_FONTS).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }
    return pdfFonts;
  }

  function buildPdf(fontFiles) {
    var r = data.report;
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter', compress: true });
    var FACE = {
      sans: ['helvetica', 'normal'], bold: ['helvetica', 'bold'], display: ['helvetica', 'bold'],
      serif: ['times', 'normal'], accent: ['helvetica', 'bold'], mono: ['courier', 'normal']
    };
    if (fontFiles) {
      var MAP = { sans: 'InterTight-400', bold: 'InterTight-800', display: 'Anton-400', serif: 'InstrumentSerif-400', accent: 'InstrumentSans-700', mono: 'DMMono-400' };
      Object.keys(MAP).forEach(function (k) {
        var f = MAP[k];
        if (!fontFiles[f]) return;
        doc.addFileToVFS(f + '.ttf', fontFiles[f]);
        doc.addFont(f + '.ttf', f, 'normal');
        FACE[k] = [f, 'normal'];
      });
    }

    var PW = 612, PH = 792, M = 50, CW = PW - M * 2, HERO = 152, BOTTOM = PH - 26;
    var MINT = [149, 255, 177], SOFT = [239, 255, 244], FOREST = [7, 56, 35], INK = [0, 0, 0], WHITE = [255, 255, 255],
      GREY = [90, 90, 90], DIM = [104, 150, 124];
    var draw = false;

    function font(k, size, color) { doc.setFont(FACE[k][0], FACE[k][1]); doc.setFontSize(size); doc.setTextColor.apply(doc, color || INK); }
    function width(str, k, size, cs) { font(k, size); return doc.getTextWidth(str) + (cs || 0) * str.length; }
    function txt(str, x, y, k, size, color, opt) { font(k, size, color); if (draw) doc.text(str, x, y, opt || {}); }
    function wrap(str, k, size, w) { font(k, size); return doc.splitTextToSize(str, w); }
    function box(x, y, w, h, rad, fill, stroke, lw) {
      if (!draw) return;
      doc.setFillColor.apply(doc, fill);
      if (stroke) { doc.setDrawColor.apply(doc, stroke); doc.setLineWidth(lw || 1.5); }
      doc.roundedRect(x, y, w, h, rad, rad, stroke ? 'FD' : 'F');
    }
    function clean(s) { return String(s).replace(/−/g, '-'); }
    var when = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    var mode = r.level + ' Mode';
    var accent = r.accent && r.name.slice(-r.accent.length) === r.accent ? r.accent : r.name.split(' ').slice(-1)[0];
    var lead = r.name.slice(0, r.name.length - accent.length).trim();

    // ---- banner: type only ----
    function banner() {
      if (draw) { doc.setFillColor.apply(doc, FOREST); doc.rect(0, 0, PW, HERO, 'F'); }
      // mode chip
      var cs = 15.5, cw = width(mode, 'serif', cs) + 24, ch = 26, cx = (PW - cw) / 2, cy = 30;
      box(cx, cy, cw, ch, 5, MINT, INK, 1.5);
      txt(mode, PW / 2, cy + 18, 'serif', cs, INK, { align: 'center' });

      // title: heavy sans lead + mint serif accent (same face as the mode chip), one centred line
      var size = 40, lw, aw;
      for (;;) {
        lw = lead ? width(lead + ' ', 'bold', size) : 0; aw = width(accent, 'serif', size * 1.12);
        if (lw + aw <= CW || size <= 20) break;
        size -= 1;
      }
      var tx = (PW - lw - aw) / 2, ty = 100;
      if (lead) txt(lead + ' ', tx, ty, 'bold', size, WHITE);
      txt(accent, tx + lw, ty, 'serif', size * 1.12, MINT);

      // where you sit on the scale
      var idx = Number(String(data.bucket).replace(/\D/g, '')) - 1, ls = 7, gapW = 26, pad = 7;
      var ws = LEVELS.map(function (l) { return width(l.toUpperCase(), 'mono', ls, 0.8); });
      var total = ws.reduce(function (a, b) { return a + b; }, 0) + gapW * (LEVELS.length - 1);
      var lx = (PW - total) / 2, ly = 130;
      LEVELS.forEach(function (l, i) {
        if (i === idx) box(lx - pad, ly - 9.5, ws[i] + pad * 2 - 0.8, 14, 7, MINT);
        txt(l.toUpperCase(), lx, ly, 'mono', ls, i === idx ? INK : DIM, { charSpace: 0.8 });
        if (i < LEVELS.length - 1) txt('·', lx + ws[i] + gapW / 2, ly, 'mono', ls, DIM, { align: 'center' });
        lx += ws[i] + gapW;
      });
    }

    // ---- body, laid out at type scale s; returns the final y ----
    function body(s) {
      var y = HERO + 30 * s;
      function para(str, k, size, lh, color) {
        wrap(str, k, size, CW).forEach(function (l) { txt(l, M, y + size * 0.78, k, size, color); y += lh; });
      }

      txt(('Prepared for ' + data.firstName + ' ' + data.lastName + '  ·  ' + when).toUpperCase(), M, y, 'mono', 8, FOREST, { charSpace: 0.6 });
      y += 16 * s;
      para(r.reading, 'sans', 11 * s, 15.5 * s);
      y += 12 * s;

      if (data.dream) {
        var qs = 13.5 * s, ql = wrap('“' + data.dream + '”', 'serif', qs, CW - 28), qh = 26 * s + ql.length * qs * 1.2;
        box(M, y, CW, qh, 8, SOFT, INK, 1.2);
        txt('YOUR DREAM, IN YOUR WORDS', M + 14, y + 13 * s, 'mono', 7 * s, FOREST, { charSpace: 0.5 });
        ql.forEach(function (l, i) { txt(l, M + 14, y + 29 * s + i * qs * 1.2, 'serif', qs, INK); });
        y += qh + 16 * s;
      }

      var h2 = 28 * s;
      txt('What can change this', M, y + h2 * 0.82, 'display', h2, INK);
      y += h2 + 10 * s;

      r.moves.forEach(function (m, i) {
        var size = 9.5 * s, lh = 12.8 * s, pad = 10 * s, numW = 44 * s, tx = M + 14 + numW;
        var ls = wrap(m, 'sans', size, CW - (tx - M) - 14), h = Math.max(ls.length * lh, 22 * s) + pad * 2;
        box(M, y, CW, h, 7, MINT, INK, 1.5);
        txt(('0' + (i + 1)).slice(-2), M + 14, y + h / 2 + 7.5 * s, 'display', 21 * s, FOREST);
        var top = y + (h - ls.length * lh) / 2;
        ls.forEach(function (l, j) { txt(l, tx, top + size * 0.95 + j * lh, 'sans', size, INK); });
        y += h + 6 * s;
      });
      y += 8 * s;

      para(r.note, 'sans', 11 * s, 15.5 * s);
      y += 12 * s;

      var zs = data.zipStats;
      if (zs && zs.tiles && zs.tiles.length) {
        var pad = 12 * s, size = 9 * s, lh = 12 * s, ix = M + 14, iw = CW - 28;
        var zl = [];
        zs.lines.forEach(function (l) {
          var k = l.strong ? 'bold' : 'sans';
          wrap(clean(l.text), k, size, iw).forEach(function (t) { zl.push([t, k]); });
        });
        var tw = iw / zs.tiles.length, vs = (zs.tiles.length <= 2 ? 26 : 22) * s, lbs = 6.5 * s;
        var labels = zs.tiles.map(function (t) { return wrap(t.label, 'mono', lbs, tw - 12); });
        var tilesH = vs + 5 * s + Math.max.apply(null, labels.map(function (l) { return l.length; })) * lbs * 1.3;
        var src = wrap(clean(zs.source) + ' Estimates, rounded.', 'mono', 5.6 * s, iw);
        var head = 'YOUR ZIP, BY THE NUMBERS  ·  ' + clean(zs.title) + (zs.subtitle ? '  ·  ' + clean(zs.subtitle) : '');
        var zh = pad + 7 * s + 12 * s + tilesH + 12 * s + zl.length * lh + 5 * s + src.length * 7.2 * s + pad;
        box(M, y, CW, zh, 8, SOFT, INK, 1.2);
        var yy = y + pad + 7 * s;
        txt(head.toUpperCase(), ix, yy, 'mono', 7 * s, FOREST, { charSpace: 0.5 });
        yy += 12 * s;
        zs.tiles.forEach(function (t, i) {
          var x = ix + i * tw;
          txt(clean(t.value), x, yy + vs * 0.86, 'display', vs, INK);
          labels[i].forEach(function (l, j) { txt(l, x, yy + vs + 5 * s + (j + 0.8) * lbs * 1.3, 'mono', lbs, FOREST); });
        });
        yy += tilesH + 12 * s;
        zl.forEach(function (l) { txt(l[0], ix, yy + size * 0.9, l[1], size, INK); yy += lh; });
        yy += 5 * s;
        src.forEach(function (l) { txt(l, ix, yy + 5.6 * s, 'mono', 5.6 * s, GREY); yy += 7.2 * s; });
        y += zh + 12 * s;
      }

      // book band
      var ph = 88 * s;
      box(M, y, CW, ph, 9, MINT, INK, 1.5);
      var px = M + 18, pw = CW - 36;
      txt('Feeling broke is temporary.', px, y + 24 * s, 'bold', 14 * s, INK);
      txt('What you learn in the book shouldn’t be.', px, y + 39 * s, 'sans', 10.5 * s, INK);
      wrap(BOOK_LINE, 'sans', 7.6 * s, pw).forEach(function (l, i) { txt(l, px, y + 54 * s + i * 9.6 * s, 'sans', 7.6 * s, INK); });
      txt('Follow along: ' + FOLLOW_HANDLE, px, y + ph - 11 * s, 'mono', 8 * s, FOREST);
      y += ph + 12 * s;

      wrap(PDF_DISCLAIMER, 'mono', 5.4 * s, CW).forEach(function (l) { txt(l, M, y + 4.5 * s, 'mono', 5.4 * s, GREY); y += 7 * s; });
      return y;
    }

    // measure, shrinking the type until it all fits on one page
    var SCALES = [1, 0.96, 0.92, 0.88, 0.84, 0.8, 0.76, 0.72], s = SCALES[SCALES.length - 1];
    for (var i = 0; i < SCALES.length; i++) if (body(SCALES[i]) <= BOTTOM) { s = SCALES[i]; break; }
    draw = true;
    banner();
    body(s);

    doc.setProperties({ title: 'How broke are you? ' + r.name, author: 'Unbroke', subject: mode });
    doc.save('unbroke-report-' + r.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.pdf');
  }
})();
</script>
