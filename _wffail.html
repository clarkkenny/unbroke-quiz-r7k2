<!doctype html><html><head><meta charset="utf-8"></head><body>
<div data-unbroke-quiz></div><script src="widget/unbroke-quiz.js" defer></script>
<div class="w-form" style="display:none"><form data-name="Quiz Signup"><input name="Name"><input name="Email" type="email"><input type="submit"></form>
<div class="w-form-done" style="display:none"></div><div class="w-form-fail" style="display:none"></div></div>
<script>document.querySelector('form').addEventListener('submit',function(e){e.preventDefault();window.__fields=[...this.querySelectorAll('input:not([type=submit])')].map(i=>i.name+'='+i.value);setTimeout(()=>{document.querySelector('.w-form-fail').style.display='block'},400)})</script>
</body></html>
